<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 494" role="img" aria-labelledby="title description">
  <title id="title">From source file to a received beat</title>
  <desc id="description">Edit the Python source, build the workspace against the underlay, source the installed overlay in the run shell, and verify the heartbeat from a second shell.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#17664d" d="M0 1l9 4-9 4z"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#315e80" d="M0 1l9 4-9 4z"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#914923" d="M0 1l9 4-9 4z"/></marker>
  </defs>
  <rect x=".5" y=".5" width="639" height="493" rx="15" fill="#f2f5ed" stroke="#cbd9cd"/>
  <text x="28" y="34" fill="#17664d" font-family="system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">ROS 2 / BUILD &amp; RUN</text>
  <text x="28" y="71" fill="#153629" font-family="system-ui, sans-serif" font-size="29" font-weight="750" text-anchor="start">From source file to a received beat</text>
  <rect x="62" y="105" width="548" height="60" rx="10" fill="#ffffff" stroke="#cbd9cd"/>
  <circle cx="34" cy="135" r="15" fill="#17664d" stroke="none"/>
  <text x="34" y="141" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="750" text-anchor="middle">1</text>
  <text x="82" y="141" fill="#153629" font-family="system-ui, sans-serif" font-size="22" font-weight="750" text-anchor="start">Edit source</text>
  <text x="304" y="141" fill="#415e50" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="start">Write the node and entry point</text>
  <path d="M34 153v44" fill="none" stroke="#17664d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
  <rect x="62" y="196" width="548" height="60" rx="10" fill="#ffffff" stroke="#cbd9cd"/>
  <circle cx="34" cy="226" r="15" fill="#17664d" stroke="none"/>
  <text x="34" y="232" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="750" text-anchor="middle">2</text>
  <text x="82" y="232" fill="#153629" font-family="system-ui, sans-serif" font-size="22" font-weight="750" text-anchor="start">Build</text>
  <text x="304" y="232" fill="#415e50" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="start">colcon installs the package</text>
  <path d="M34 244v44" fill="none" stroke="#17664d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
  <rect x="62" y="287" width="548" height="60" rx="10" fill="#ffffff" stroke="#cbd9cd"/>
  <circle cx="34" cy="317" r="15" fill="#17664d" stroke="none"/>
  <text x="34" y="323" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="750" text-anchor="middle">3</text>
  <text x="82" y="323" fill="#153629" font-family="system-ui, sans-serif" font-size="22" font-weight="750" text-anchor="start">Source overlay</text>
  <text x="304" y="323" fill="#415e50" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="start">Make this build discoverable</text>
  <path d="M34 335v44" fill="none" stroke="#17664d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
  <rect x="62" y="378" width="548" height="60" rx="10" fill="#e6eef5" stroke="#cbd9cd"/>
  <circle cx="34" cy="408" r="15" fill="#315e80" stroke="none"/>
  <text x="34" y="414" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="750" text-anchor="middle">4</text>
  <text x="82" y="414" fill="#153629" font-family="system-ui, sans-serif" font-size="22" font-weight="750" text-anchor="start">Run and observe</text>
  <text x="304" y="414" fill="#415e50" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="start">Start node; echo in a new shell</text>
  <text x="28" y="470" fill="#415e50" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="start">A successful build does not prove a message arrived.</text>
</svg>
