<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title description">
  <title id="title">Predict, then correct if justified</title>
  <desc id="description">Wheel motion and process noise move and widen the prediction. A compatible time-aligned wall fix updates mean and uncertainty; a missing or rejected fix leaves just the prediction.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#17664d" d="M0 1l9 4-9 4z"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#315e80" d="M0 1l9 4-9 4z"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#914923" d="M0 1l9 4-9 4z"/></marker>
  </defs>
  <rect x=".5" y=".5" width="639" height="419" rx="15" fill="#f2f5ed" stroke="#cbd9cd"/>
  <text x="28" y="34" fill="#17664d" font-family="system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">ESTIMATION / ONE UPDATE</text>
  <text x="28" y="71" fill="#153629" font-family="system-ui, sans-serif" font-size="29" font-weight="750" text-anchor="start">Predict, then correct if justified</text>

  <rect x="36" y="107" width="568" height="64" rx="10" fill="#ffffff" stroke="#cbd9cd"/>
  <text x="320" y="147" fill="#153629" font-family="system-ui, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Previous estimate + wheel increment</text>
  <path d="M320 174v23" fill="none" stroke="#17664d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
  <rect x="173" y="204" width="294" height="61" rx="10" fill="#e2eee3" stroke="#cbd9cd"/>
  <text x="320" y="243" fill="#153629" font-family="system-ui, sans-serif" font-size="23" font-weight="750" text-anchor="middle">Predicted belief</text>
  <path d="M320 268v20H157v22" fill="none" stroke="#17664d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
  <path d="M320 288h163v22" fill="none" stroke="#914923" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#amber-arrow)"/>
  <rect x="35" y="316" width="244" height="75" rx="10" fill="#e6eef5" stroke="#cbd9cd"/>
  <rect x="361" y="316" width="244" height="75" rx="10" fill="#f9eada" stroke="#cbd9cd"/>
  <text x="157" y="347" fill="#315e80" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Valid wall fix</text>
  <text x="157" y="374" fill="#153629" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Correct the estimate</text>
  <text x="483" y="347" fill="#914923" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Missing or rejected</text>
  <text x="483" y="374" fill="#153629" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Keep the prediction</text>
</svg>
