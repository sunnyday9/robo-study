<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 316" role="img" aria-labelledby="title description">
  <title id="title">Tabletop transform tree</title>
  <desc id="description">The base frame is the root. Elbow joint updates rotate the wrist frame around base Z and appear on /tf. A rigid 0.2 meter offset along wrist X connects the wrist to the tool frame on /tf_static.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="518" height="314" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M125 84 V128"/>
    <path d="M125 184 V228"/>
  </g>
  <g stroke-width="1.5">
    <rect x="30" y="30" width="190" height="54" rx="9" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="30" y="130" width="190" height="54" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="30" y="230" width="190" height="54" rx="9" fill="#ccfbf1" stroke="#0f766e"/>
  </g>
  <g text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Consolas, monospace" font-size="21" font-weight="600">
    <text x="125" y="64">base_link</text>
    <text x="125" y="164">wrist_link</text>
    <text x="125" y="264">tool_link</text>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="19">
    <text x="250" y="96" font-weight="700">Moving edge · /tf</text>
    <text x="250" y="121">Rotation about +Z</text>
    <text x="250" y="196" font-weight="700">Fixed edge · /tf_static</text>
    <text x="250" y="221">0.2 m along wrist +X</text>
  </g>
</svg>
