<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" role="img" aria-labelledby="title desc">
  <title id="title">Move recordings across the robot boundary as files</title>
  <desc id="desc">The real robot publishes to a recorder inside the isolated robot network. A reviewed bag export crosses to the lab as files, without a live DDS route. A replay process publishes to an analysis subscriber using local DDS in the lab.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#29445b"/>
    </marker>
  </defs>
  <rect width="680" height="510" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#192c3e">
    <rect x="22" y="24" width="636" height="156" rx="14" fill="#e9f2fa" stroke="#56758d" stroke-width="2"/>
    <text x="44" y="58" font-size="22" font-weight="700">Physical robot network</text>
    <rect x="44" y="95" width="188" height="56" rx="8" fill="#fff" stroke="#56758d" stroke-width="2"/>
    <text x="138" y="130" text-anchor="middle" font-size="19">Real robot</text>
    <rect x="448" y="95" width="188" height="56" rx="8" fill="#fff" stroke="#56758d" stroke-width="2"/>
    <text x="542" y="130" text-anchor="middle" font-size="19">Bag recorder</text>
    <path d="M242 123H428" stroke="#29445b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="335" y="110" text-anchor="middle" font-size="17">Sensor topics</text>

    <path d="M542 152V195" stroke="#29445b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="44" y="206" width="592" height="91" rx="10" fill="#fff4d8" stroke="#8a6932" stroke-width="2"/>
    <text x="340" y="243" text-anchor="middle" font-size="22" font-weight="700">Reviewed bag export</text>
    <text x="340" y="273" text-anchor="middle" font-size="18">Files only · no live DDS route</text>
    <rect x="22" y="330" width="636" height="156" rx="14" fill="#e5f4ee" stroke="#4d7968" stroke-width="2"/>
    <text x="44" y="364" font-size="22" font-weight="700">Learning lab</text>
    <path d="M214 298V402" stroke="#29445b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="44" y="414" width="188" height="50" rx="8" fill="#fff" stroke="#4d7968" stroke-width="2"/>
    <text x="138" y="445" text-anchor="middle" font-size="19">Bag replay</text>
    <rect x="448" y="414" width="188" height="50" rx="8" fill="#fff" stroke="#4d7968" stroke-width="2"/>
    <text x="542" y="445" text-anchor="middle" font-size="19">Analysis subscriber</text>
    <path d="M242 439H428" stroke="#29445b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="335" y="426" text-anchor="middle" font-size="17">Local DDS only</text>
  </g>
</svg>
